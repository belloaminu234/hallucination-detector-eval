[project]
name = "hallucination-detector-eval"
version = "0.1.0"
description = "Detects hallucinated API endpoints, parameters, and ID strings in agent output, checked against a ground-truth API spec. Standard library only."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
halluceval = "halluceval.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
